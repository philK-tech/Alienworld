<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EYWA // PANDORA NIGHT RIDE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02050c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #dff8ff;
      user-select: none;
    }
    canvas#scene {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud-top {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
      opacity: 0.88;
      transition: opacity 0.6s ease;
    }
    #hud-top .title {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6ceeff;
      text-shadow: 0 0 12px rgba(56, 224, 255, 0.45);
    }
    #hud-top .chapter {
      font-size: 12px;
      color: rgba(215, 244, 255, 0.78);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
    }
    #hud-pill {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(6, 13, 26, 0.62);
      border: 1px solid rgba(110, 232, 255, 0.22);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.55);
    }
    button.pill-btn {
      appearance: none;
      border: none;
      background: rgba(25, 195, 235, 0.16);
      color: #dcf8ff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.12s ease;
    }
    button.pill-btn:hover {
      background: rgba(45, 215, 255, 0.3);
    }
    button.pill-btn:active {
      transform: scale(0.96);
    }
    button.pill-btn.muted {
      opacity: 0.55;
      background: rgba(255, 255, 255, 0.06);
    }
    #err-banner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      max-width: 520px;
      padding: 18px 22px;
      border-radius: 10px;
      background: rgba(18, 8, 16, 0.92);
      border: 1px solid rgba(255, 110, 150, 0.5);
      color: #ffd6e2;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hud-top">
    <div class="title">EYWA // PANDORA NIGHT RIDE</div>
    <div class="chapter" id="chapter-label">Schlucht der Leuchtenden Wasserfälle</div>
  </div>
  <div id="hud-pill">
    <button class="pill-btn" id="btn-toggle" title="Leertaste">Stop</button>
    <button class="pill-btn muted" id="btn-audio" title="M">Ton Aus</button>
  </div>
  <div id="err-banner"></div>

  <script>
  (() => {
    "use strict";

    const canvas = document.getElementById("scene");
    const errBanner = document.getElementById("err-banner");
    const chapterEl = document.getElementById("chapter-label");
    const btnToggle = document.getElementById("btn-toggle");
    const btnAudio = document.getElementById("btn-audio");

    function showError(msg) {
      errBanner.style.display = "block";
      errBanner.textContent = msg;
    }

    const gl = canvas.getContext("webgl2", { antialias: false, powerPreference: "high-performance" });
    if (!gl) {
      showError("WebGL2 wird von diesem Browser/Gerät nicht unterstützt.");
      return;
    }

    // --- Math & Noise Utilities ---
    const LOOP_LENGTH = 480.0;

    function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function smoothstep(e0, e1, x) {
      const t = clamp01((x - e0) / (e1 - e0));
      return t * t * (3.0 - 2.0 * t);
    }
    function hash2(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }
    function vnoise2(x, y) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const ux = fx * fx * (3.0 - 2.0 * fx);
      const uy = fy * fy * (3.0 - 2.0 * fy);
      const a = hash2(ix, iy);
      const b = hash2(ix + 1, iy);
      const c = hash2(ix, iy + 1);
      const d = hash2(ix + 1, iy + 1);
      return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
    }
    function fbm2(x, y, octaves = 4) {
      let val = 0.0, amp = 0.5, freq = 1.0, norm = 0.0;
      for (let i = 0; i < octaves; i++) {
        val += amp * vnoise2(x * freq, y * freq);
        norm += amp;
        amp *= 0.5;
        freq *= 2.03;
      }
      return val / norm;
    }

    // Gewundener Fluss entlang -Z. Alle Frequenzen sind Vielfache von 2*PI/LOOP_LENGTH,
    // dadurch schließt die Strecke nahtlos an ihren Anfang an.
    const KZ = (Math.PI * 2.0) / LOOP_LENGTH;
    function wrapZ(z) {
      return -((((-z) % LOOP_LENGTH) + LOOP_LENGTH) % LOOP_LENGTH);
    }
    function riverCenterX(z) {
      return Math.sin(z * KZ * 2.0) * 7.5 + Math.cos(z * KZ) * 4.2 + Math.sin(z * KZ * 3.0 + 1.3) * 1.6;
    }
    function riverSlopeX(z) {
      const eps = 0.5;
      return (riverCenterX(z + eps) - riverCenterX(z - eps)) / (2.0 * eps);
    }
    function riverHalfWidth(z) {
      return 5.6 + Math.sin(z * KZ * 4.0 + 1.1) * 1.3;
    }
    // fbm, die in z periodisch über die Schleifenlänge ist (Überblendung zweier Abtastungen)
    function pnoise(x, z, scale, octaves) {
      z = wrapZ(z);
      const s = -z / LOOP_LENGTH;
      return lerp(fbm2(x * scale, z * scale, octaves), fbm2(x * scale, (z + LOOP_LENGTH) * scale, octaves), s);
    }
    // Höhe des Talbodens an (x, z), identisch mit dem Terrain-Mesh
    function terrainHeight(x, z) {
      const cx = riverCenterX(z);
      const hw = riverHalfWidth(z);
      const ax = Math.abs(x - cx);
      const d = Math.max(0.0, ax - hw);
      const riverDip = -1.35 * (1.0 - smoothstep(0.0, hw * 1.12, ax));
      const bankRise = Math.pow(d / 15.0, 1.4) * 5.2;
      const ridge = smoothstep(20.0, 52.0, d) * (3.0 + 6.0 * pnoise(x, z, 0.04, 3));
      const undulation = (pnoise(x, z, 0.16, 3) - 0.5) * 0.8 * smoothstep(0.5, 4.0, d);
      return riverDip + bankRise + ridge + undulation;
    }

    // Mat4 helpers (column-major)
    const Mat4 = {
      create() {
        const m = new Float32Array(16);
        m[0] = m[5] = m[10] = m[15] = 1;
        return m;
      },
      multiply(out, a, b) {
        const o = out === a || out === b ? new Float32Array(16) : out;
        for (let c = 0; c < 4; c++) {
          const b0 = b[c * 4 + 0], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
          o[c * 4 + 0] = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
          o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
          o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
          o[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
        }
        if (out !== o) out.set(o);
        return out;
      },
      perspective(out, fovRad, aspect, near, far) {
        const f = 1.0 / Math.tan(fovRad * 0.5);
        const nf = 1.0 / (near - far);
        out.fill(0);
        out[0] = f / aspect;
        out[5] = f;
        out[10] = (far + near) * nf;
        out[11] = -1.0;
        out[14] = 2.0 * far * near * nf;
        return out;
      },
      lookAt(out, eye, target, up) {
        let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
        let zl = Math.hypot(zx, zy, zz) || 1;
        zx /= zl; zy /= zl; zz /= zl;

        let xx = up[1] * zz - up[2] * zy;
        let xy = up[2] * zx - up[0] * zz;
        let xz = up[0] * zy - up[1] * zx;
        let xl = Math.hypot(xx, xy, xz) || 1;
        xx /= xl; xy /= xl; xz /= xl;

        const yx = zy * xz - zz * xy;
        const yy = zz * xx - zx * xz;
        const yz = zx * xy - zy * xx;

        out[0] = xx; out[4] = xy; out[8]  = xz; out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
        out[1] = yx; out[5] = yy; out[9]  = yz; out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
        out[2] = zx; out[6] = zy; out[10] = zz; out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
        out[3] = 0;  out[7] = 0;  out[11] = 0;  out[15] = 1;
        return out;
      },
      compose(out, pos, rotY, rotX, rotZ, scale) {
        const cy = Math.cos(rotY), sy = Math.sin(rotY);
        const cx = Math.cos(rotX), sx = Math.sin(rotX);
        const cz = Math.cos(rotZ), sz = Math.sin(rotZ);

        // R = Ry * Rx * Rz
        const r00 = cy * cz + sy * sx * sz;
        const r01 = -cy * sz + sy * sx * cz;
        const r02 = sy * cx;

        const r10 = cx * sz;
        const r11 = cx * cz;
        const r12 = -sx;

        const r20 = -sy * cz + cy * sx * sz;
        const r21 = sy * sz + cy * sx * cz;
        const r22 = cy * cx;

        const sxS = scale[0], syS = scale[1], szS = scale[2];
        out[0] = r00 * sxS; out[4] = r01 * syS; out[8]  = r02 * szS; out[12] = pos[0];
        out[1] = r10 * sxS; out[5] = r11 * syS; out[9]  = r12 * szS; out[13] = pos[1];
        out[2] = r20 * sxS; out[6] = r21 * syS; out[10] = r22 * szS; out[14] = pos[2];
        out[3] = 0;         out[7] = 0;         out[11] = 0;         out[15] = 1;
        return out;
      }
    };

    // --- Geometry Builder ---
    // Vertex layout (12 floats per vertex):
    // pos(3), normal(3), uv(2), extra(3: ao, glow/edge, sway/layer), matId(1)
    function createGeometryBuilder() {
      return {
        positions: [],
        normals: [],
        uvs: [],
        extras: [],
        matIds: [],
        indices: [],
        pushVertex(px, py, pz, nx, ny, nz, u, v, e0 = 1.0, e1 = 0.0, e2 = 0.0, matId = 0) {
          this.positions.push(px, py, pz);
          this.normals.push(nx, ny, nz);
          this.uvs.push(u, v);
          this.extras.push(e0, e1, e2);
          this.matIds.push(matId);
        },
        pushTri(a, b, c) {
          this.indices.push(a, b, c);
        },
        pushQuad(a, b, c, d) {
          this.indices.push(a, b, c, a, c, d);
        },
        computeSmoothNormals() {
          const count = this.positions.length / 3;
          const acc = new Float32Array(count * 3);
          for (let i = 0; i < this.indices.length; i += 3) {
            const ia = this.indices[i], ib = this.indices[i + 1], ic = this.indices[i + 2];
            const ax = this.positions[ia * 3], ay = this.positions[ia * 3 + 1], az = this.positions[ia * 3 + 2];
            const bx = this.positions[ib * 3], by = this.positions[ib * 3 + 1], bz = this.positions[ib * 3 + 2];
            const cx = this.positions[ic * 3], cy = this.positions[ic * 3 + 1], cz = this.positions[ic * 3 + 2];
            const ux = bx - ax, uy = by - ay, uz = bz - az;
            const vx = cx - ax, vy = cy - ay, vz = cz - az;
            const nx = uy * vz - uz * vy;
            const ny = uz * vx - ux * vz;
            const nz = ux * vy - uy * vx;
            for (const idx of [ia, ib, ic]) {
              acc[idx * 3] += nx;
              acc[idx * 3 + 1] += ny;
              acc[idx * 3 + 2] += nz;
            }
          }
          for (let i = 0; i < count; i++) {
            let nx = acc[i * 3], ny = acc[i * 3 + 1], nz = acc[i * 3 + 2];
            const len = Math.hypot(nx, ny, nz) || 1.0;
            this.normals[i * 3] = nx / len;
            this.normals[i * 3 + 1] = ny / len;
            this.normals[i * 3 + 2] = nz / len;
          }
        },
        computeFacetedNormals() {
          // Unrolls indexed triangles into crisp faceted triangles for craggy rock strata
          const newPos = [], newNorm = [], newUv = [], newExt = [], newMat = [], newIdx = [];
          for (let i = 0; i < this.indices.length; i += 3) {
            const ia = this.indices[i], ib = this.indices[i + 1], ic = this.indices[i + 2];
            const ax = this.positions[ia * 3], ay = this.positions[ia * 3 + 1], az = this.positions[ia * 3 + 2];
            const bx = this.positions[ib * 3], by = this.positions[ib * 3 + 1], bz = this.positions[ib * 3 + 2];
            const cx = this.positions[ic * 3], cy = this.positions[ic * 3 + 1], cz = this.positions[ic * 3 + 2];
            const ux = bx - ax, uy = by - ay, uz = bz - az;
            const vx = cx - ax, vy = cy - ay, vz = cz - az;
            let nx = uy * vz - uz * vy;
            let ny = uz * vx - ux * vz;
            let nz = ux * vy - uy * vx;
            const len = Math.hypot(nx, ny, nz) || 1.0;
            nx /= len; ny /= len; nz /= len;
            for (const vIdx of [ia, ib, ic]) {
              const outIdx = newPos.length / 3;
              newPos.push(this.positions[vIdx * 3], this.positions[vIdx * 3 + 1], this.positions[vIdx * 3 + 2]);
              newNorm.push(nx, ny, nz);
              newUv.push(this.uvs[vIdx * 2], this.uvs[vIdx * 2 + 1]);
              newExt.push(this.extras[vIdx * 3], this.extras[vIdx * 3 + 1], this.extras[vIdx * 3 + 2]);
              newMat.push(this.matIds[vIdx]);
              newIdx.push(outIdx);
            }
          }
          this.positions = newPos;
          this.normals = newNorm;
          this.uvs = newUv;
          this.extras = newExt;
          this.matIds = newMat;
          this.indices = newIdx;
        }
      };
    }

    function uploadStaticMesh(glCtx, builder) {
      const vertCount = builder.positions.length / 3;
      const interleaved = new Float32Array(vertCount * 12);
      for (let i = 0; i < vertCount; i++) {
        const o = i * 12;
        interleaved[o + 0] = builder.positions[i * 3 + 0];
        interleaved[o + 1] = builder.positions[i * 3 + 1];
        interleaved[o + 2] = builder.positions[i * 3 + 2];
        interleaved[o + 3] = builder.normals[i * 3 + 0];
        interleaved[o + 4] = builder.normals[i * 3 + 1];
        interleaved[o + 5] = builder.normals[i * 3 + 2];
        interleaved[o + 6] = builder.uvs[i * 2 + 0];
        interleaved[o + 7] = builder.uvs[i * 2 + 1];
        interleaved[o + 8] = builder.extras[i * 3 + 0];
        interleaved[o + 9] = builder.extras[i * 3 + 1];
        interleaved[o + 10] = builder.extras[i * 3 + 2];
        interleaved[o + 11] = builder.matIds[i];
      }

      const vao = glCtx.createVertexArray();
      glCtx.bindVertexArray(vao);

      const vbo = glCtx.createBuffer();
      glCtx.bindBuffer(glCtx.ARRAY_BUFFER, vbo);
      glCtx.bufferData(glCtx.ARRAY_BUFFER, interleaved, glCtx.STATIC_DRAW);

      const stride = 12 * 4;
      glCtx.enableVertexAttribArray(0);
      glCtx.vertexAttribPointer(0, 3, glCtx.FLOAT, false, stride, 0);
      glCtx.enableVertexAttribArray(1);
      glCtx.vertexAttribPointer(1, 3, glCtx.FLOAT, false, stride, 12);
      glCtx.enableVertexAttribArray(2);
      glCtx.vertexAttribPointer(2, 2, glCtx.FLOAT, false, stride, 24);
      glCtx.enableVertexAttribArray(3);
      glCtx.vertexAttribPointer(3, 3, glCtx.FLOAT, false, stride, 32);
      glCtx.enableVertexAttribArray(4);
      glCtx.vertexAttribPointer(4, 1, glCtx.FLOAT, false, stride, 44);

      const ibo = glCtx.createBuffer();
      glCtx.bindBuffer(glCtx.ELEMENT_ARRAY_BUFFER, ibo);
      glCtx.bufferData(glCtx.ELEMENT_ARRAY_BUFFER, new Uint32Array(builder.indices), glCtx.STATIC_DRAW);

      glCtx.bindVertexArray(null);
      return { vao, indexCount: builder.indices.length };
    }

    // Instance buffer layout per instance:
    // mat4 (16 floats) + tint vec4 (4 floats) = 20 floats
    // Die Instanzen werden nach z sortiert. So lässt sich beim Zeichnen nur der Abschnitt der Strecke
    // auswählen, den die Kamera gerade sehen kann (siehe drawInstancedRange).
    function uploadInstancedMesh(glCtx, builder, matsArray, tintsArray, margin = 6.0) {
      const base = uploadStaticMesh(glCtx, builder);
      const count = tintsArray.length / 4;
      const order = Array.from({ length: count }, (_, i) => i).sort((a, b) => matsArray[b * 16 + 14] - matsArray[a * 16 + 14]);
      const instData = new Float32Array(count * 20);
      const zs = new Float32Array(count);
      order.forEach((src, i) => {
        instData.set(matsArray.subarray(src * 16, src * 16 + 16), i * 20);
        instData.set(tintsArray.subarray(src * 4, src * 4 + 4), i * 20 + 16);
        zs[i] = matsArray[src * 16 + 14];
      });

      glCtx.bindVertexArray(base.vao);
      const instBuf = glCtx.createBuffer();
      glCtx.bindBuffer(glCtx.ARRAY_BUFFER, instBuf);
      glCtx.bufferData(glCtx.ARRAY_BUFFER, instData, glCtx.STATIC_DRAW);
      for (let loc = 5; loc <= 9; loc++) {
        glCtx.enableVertexAttribArray(loc);
        glCtx.vertexAttribDivisor(loc, 1);
      }
      glCtx.bindVertexArray(null);
      return { vao: base.vao, indexCount: base.indexCount, instanceCount: count, instBuf, zs, margin };
    }

    // zs ist absteigend sortiert (0 ... -LOOP_LENGTH): erster Index mit zs[i] <= z
    function lowerIndex(zs, z) {
      let lo = 0, hi = zs.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (zs[mid] > z) lo = mid + 1; else hi = mid;
      }
      return lo;
    }

    // Zeichnet nur die Instanzen mit zMin <= z <= zMax
    function drawInstancedRange(glCtx, grp, zMin, zMax) {
      const first = lowerIndex(grp.zs, zMax + grp.margin);
      const last = lowerIndex(grp.zs, zMin - grp.margin);
      const n = last - first;
      if (n <= 0) return;
      glCtx.bindVertexArray(grp.vao);
      glCtx.bindBuffer(glCtx.ARRAY_BUFFER, grp.instBuf);
      const stride = 80, base = first * stride;
      for (let col = 0; col < 4; col++) glCtx.vertexAttribPointer(5 + col, 4, glCtx.FLOAT, false, stride, base + col * 16);
      glCtx.vertexAttribPointer(9, 4, glCtx.FLOAT, false, stride, base + 64);
      glCtx.drawElementsInstanced(glCtx.TRIANGLES, grp.indexCount, glCtx.UNSIGNED_INT, 0, n);
    }

    // --- Procedural Meshes ---
    function buildValleyTerrainMesh() {
      const b = createGeometryBuilder();
      const segX = 150;
      const segZ = Math.round(LOOP_LENGTH);
      const spanX = 120.0;
      for (let iz = 0; iz <= segZ; iz++) {
        const z = -(iz / segZ) * LOOP_LENGTH;
        const cx = riverCenterX(z);
        const hw = riverHalfWidth(z);
        for (let ix = 0; ix <= segX; ix++) {
          // Spalten nahe am Fluss dichter, weit draußen gröber
          const u = (ix / segX) * 2.0 - 1.0;
          const localX = Math.sign(u) * Math.pow(Math.abs(u), 1.7) * spanX;
          const x = cx + localX;
          const y = terrainHeight(x, z);
          const distFromRiver = Math.max(0.0, Math.abs(localX) - hw);
          const emMask = smoothstep(0.2, 1.6, distFromRiver) * (1.0 - smoothstep(14.0, 30.0, distFromRiver));
          b.pushVertex(x, y, z, 0, 1, 0, x * 0.18, z * 0.18, 0.85, emMask, 0.0, 0);
        }
      }
      const row = segX + 1;
      for (let iz = 0; iz < segZ; iz++) {
        for (let ix = 0; ix < segX; ix++) {
          const a = iz * row + ix;
          b.pushQuad(a, a + 1, a + row + 1, a + row);
        }
      }
      b.computeSmoothNormals();
      return b;
    }

    function buildWaterSurfaceMesh() {
      const b = createGeometryBuilder();
      const segX = 64;
      const segZ = Math.round(LOOP_LENGTH / 1.5);
      const spanX = 16.0;
      for (let iz = 0; iz <= segZ; iz++) {
        const z = -(iz / segZ) * LOOP_LENGTH;
        const cx = riverCenterX(z);
        for (let ix = 0; ix <= segX; ix++) {
          const vx = ix / segX;
          const x = cx + (vx * 2.0 - 1.0) * spanX;
          // e0: Nähe zum Ufer (Terrain knapp unter der Wasserlinie) für leuchtenden Uferschaum
          const shore = smoothstep(-0.7, 0.05, terrainHeight(x, z));
          b.pushVertex(x, 0.0, z, 0, 1, 0, vx, z, shore, 0.0, 0.0, 1);
        }
      }
      const row = segX + 1;
      for (let iz = 0; iz < segZ; iz++) {
        for (let ix = 0; ix < segX; ix++) {
          const a = iz * row + ix;
          b.pushQuad(a, a + 1, a + row + 1, a + row);
        }
      }
      return b;
    }

    function buildSkyDomeMesh() {

    // Sculpted waterfall cliff basin: local +Z faces toward the river
    function buildWaterfallCliffHousingMesh() {
      const b = createGeometryBuilder();
      const segsX = 28;
      const segsY = 24;
      for (let iy = 0; iy <= segsY; iy++) {
        const v = iy / segsY; // 0 = river base, 1 = top crest
        const y = v * 1.0;
        for (let ix = 0; ix <= segsX; ix++) {
          const u = ix / segsX;
          const sx = u * 2.0 - 1.0; // -1..+1 across cliff face
          const absX = Math.abs(sx);

          const chuteMask = 1.0 - smoothstep(0.14, 0.44, absX);
          const topLip = smoothstep(0.76, 0.92, v) * (1.0 - smoothstep(0.92, 1.0, v));
          const flankBulge = smoothstep(0.16, 0.62, absX) * (1.0 - smoothstep(0.76, 1.0, absX)) * 1.1;
          const taper = 1.0 - Math.pow(v, 1.75) * 0.32;
          const crag = fbm2(sx * 3.6 + 2.1, v * 5.0 + 1.4, 4);

          // Recessed dark alcove in center, overhanging lip at top crest
          let z = (-0.3 + flankBulge + (crag - 0.5) * 0.62) * taper;
          z -= chuteMask * (0.46 - topLip * 0.42);
          z += chuteMask * topLip * 0.34;

          const px = sx * (1.0 + (1.0 - v) * 0.22);
          const ao = clamp01((0.36 + 0.64 * v) * (1.0 - chuteMask * 0.45));
          const glow = smoothstep(0.42, 0.88, crag) * (1.0 - chuteMask * 0.75) * 0.5;
          b.pushVertex(px, y, z, 0, 0.2, 1, u * 3.0, v * 3.0, ao, glow, 0.0, 2);
        }
      }
      const row = segsX + 1;
      for (let iy = 0; iy < segsY; iy++) {
        for (let ix = 0; ix < segsX; ix++) {
          const a = iy * row + ix;
          const c = a + 1;
          const d = a + row;
          const e = d + 1;
          b.pushQuad(a, c, e, d);
        }
      }
      b.computeSmoothNormals();
      return b;
    }

    function buildFloatingMountainMesh() {
      const b = createGeometryBuilder();
      const rings = 40;
      const sectors = 56;
      // v=0 ist die hängende Spitze unten, v=0.7 das breite Plateau, v=1 die bemooste Kuppe
      const ringStart = [];
      for (let ir = 0; ir <= rings; ir++) {
        const v = ir / rings;
        let radius, y;
        if (v < 0.7) {
          const t = v / 0.7;
          radius = Math.pow(t, 0.72);
          y = (t - 0.7) * 0.95;
        } else {
          const t = (v - 0.7) / 0.3;
          radius = Math.cos(t * Math.PI * 0.47);
          y = t * 0.34;
        }
        ringStart.push(b.positions.length / 3);
        for (let is = 0; is <= sectors; is++) {
          const u = is / sectors;
          const ang = u * Math.PI * 2.0;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          const n = fbm2(ca * 2.2 + v * 3.0, sa * 2.2 + 8.2, 5);
          const strata = 1.0 + 0.06 * Math.sin(v * 70.0 + n * 6.0);
          const jag = (0.62 + 0.58 * n) * strata;
          const rx = ca * radius * jag;
          const rz = sa * radius * jag * 0.86;
          const glow = smoothstep(0.55, 0.85, n) * 0.6;
          b.pushVertex(rx, y, rz, rx, y + 0.2, rz, u * 4.0, v * 4.0, 0.35 + 0.65 * v, glow, 0.0, 2);
        }
      }
      const row = sectors + 1;
      for (let ir = 0; ir < rings; ir++) {
        for (let is = 0; is < sectors; is++) {
          const a = ir * row + is;
          b.pushQuad(a, a + 1, a + row + 1, a + row);
        }
      }
      b.computeSmoothNormals();

      // Lianen, die von der Unterseite herabhängen (eigene Material-ID 16)
      for (let i = 0; i < 46; i++) {
        const ang = hash2(i, 3.3) * Math.PI * 2.0;
        const v = 0.35 + hash2(i, 4.4) * 0.32;
        const t = v / 0.7;
        const rad = Math.pow(t, 0.72) * 0.8;
        const x0 = Math.cos(ang) * rad, z0 = Math.sin(ang) * rad * 0.86;
        const y0 = (t - 0.7) * 0.95;
        const len = 0.25 + hash2(i, 5.5) * 0.7;
        const w = 0.006 + hash2(i, 6.6) * 0.006;
        const nx = -Math.sin(ang), nz = Math.cos(ang);
        const segs = 10;
        const startIdx = b.positions.length / 3;
        for (let sgi = 0; sgi <= segs; sgi++) {
          const st = sgi / segs;
          const y = y0 - st * len;
          const curl = Math.sin(st * 4.0 + i) * 0.03 * st;
          b.pushVertex(x0 - nx * w + curl, y, z0 - nz * w, nx, 0, nz, 0, st * len * 30.0, 1.0, st, 1.0 + st, 16);
          b.pushVertex(x0 + nx * w + curl, y, z0 + nz * w, nx, 0, nz, 1, st * len * 30.0, 1.0, st, 1.0 + st, 16);
        }
        for (let sgi = 0; sgi < segs; sgi++) {
          const a = startIdx + sgi * 2;
          b.pushQuad(a, a + 1, a + 3, a + 2);
        }
      }
      return b;
    }

    function buildStoneArchMesh() {
      const b = createGeometryBuilder();
      const segs = 36;

        const t = i / segs;
        const ang = t * Math.PI; // 0..PI across river

        const tx = Math.sin(ang) * 11.5;
        const ty = Math.cos(ang) * 10.5;
        const tLen = Math.hypot(tx, ty) || 1.0;
        const nxBase = -ty / tLen;
        const nyBase = tx / tLen;

        for (let j = 0; j <= radialSegs; j++) {
          const v = j / radialSegs;
          const phi = v * Math.PI * 2.0;
          const crag = 0.78 + 0.36 * fbm2(t * 9.0, v * 5.0, 3);
          const r = thick * crag;
          const px = archX + nxBase * Math.cos(phi) * r;
          const py = archY + nyBase * Math.cos(phi) * r;
          const pz = Math.sin(phi) * r * 1.15;
          const glow = smoothstep(0.62, 0.92, crag) * 0.45;
          b.pushVertex(px, py, pz, nxBase * Math.cos(phi), nyBase * Math.cos(phi), Math.sin(phi), t * 5.0, v * 2.0, 0.75, glow, 0.0, 2);
        }
      }
      const row = radialSegs + 1;
      for (let i = 0; i < segs; i++) {
        for (let j = 0; j < radialSegs; j++) {
          const a = i * row + j;
          const c = a + 1;
          const d = a + row;
          const e = d + 1;
          b.pushQuad(a, c, e, d);
        }
      }
      b.computeSmoothNormals();

    function buildJungleTreeMesh() {
      const b = createGeometryBuilder();
      // Stamm mit Brettwurzeln, leicht gebogen. Skaliert wird mit [r, h, r].
      const trunkRings = 22;
      const trunkSectors = 16;
      const trunkCenter = (v) => [Math.sin(v * Math.PI * 1.35) * 0.3, Math.cos(v * Math.PI * 1.1) * 0.22 - 0.22];
      for (let ir = 0; ir <= trunkRings; ir++) {
        const v = ir / trunkRings;
        const rootFlare = 1.0 + 2.4 * Math.pow(1.0 - v, 4.0);
        const rad = lerp(0.42, 0.16, Math.pow(v, 0.8)) * rootFlare;
        const [bx, bz] = trunkCenter(v);
        for (let is = 0; is <= trunkSectors; is++) {
          const u = is / trunkSectors;
          const ang = u * Math.PI * 2.0;
          const buttress = 1.0 + 0.6 * Math.pow(Math.max(0.0, Math.cos(ang * 5.0)), 3.0) * Math.pow(1.0 - v, 3.0);
          const px = bx + Math.cos(ang) * rad * buttress;
          const pz = bz + Math.sin(ang) * rad * buttress;
          b.pushVertex(px, v - 0.04, pz, Math.cos(ang), 0.15, Math.sin(ang), u * 2.0, v * 5.0, 0.3 + 0.6 * v, 1.0, v * 0.3, 5);
        }
      }
      const row = trunkSectors + 1;
      for (let ir = 0; ir < trunkRings; ir++) {
        for (let is = 0; is < trunkSectors; is++) {
          const a = ir * row + is;
          b.pushQuad(a, a + 1, a + row + 1, a + row);
        }
      }

      // Blätterdach aus breiten, nach unten hängenden Blättern in mehreren Etagen
      const [topX, topZ] = trunkCenter(1.0);
      const tiers = [
        { y: 0.80, n: 9, len: 2.9, w: 0.95 },
        { y: 0.90, n: 8, len: 2.3, w: 0.85 },
        { y: 0.98, n: 6, len: 1.6, w: 0.7 }
      ];
      tiers.forEach((tier, ti) => {
        for (let k = 0; k < tier.n; k++) {
          const ang = (k / tier.n) * Math.PI * 2.0 + ti * 0.7 + hash2(k, ti) * 0.4;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          const len = tier.len * (0.8 + hash2(k, ti + 7.0) * 0.4);
          const segL = 7, segW = 2;
          const base = b.positions.length / 3;
          for (let i = 0; i <= segL; i++) {
            const t = i / segL;
            const r = 0.15 + t * len;
            const droop = 0.03 * Math.sin(t * Math.PI) - t * t * 0.09;
            const halfW = Math.pow(Math.sin(Math.min(t * 1.15, 1.0) * Math.PI), 0.7) * tier.w * 0.5 + 0.02;
            for (let j = 0; j <= segW; j++) {
              const s2 = j / segW * 2.0 - 1.0;
              const crease = (1.0 - Math.abs(s2)) * 0.012;
              const px = topX + ca * r - sa * s2 * halfW;
              const pz = topZ + sa * r + ca * s2 * halfW;
              b.pushVertex(px, tier.y + droop + crease, pz, 0, 1, 0, j / segW, t, 0.55 + 0.3 * t, 0.0, 0.4 + t * 0.6, 6);
            }
          }
          for (let i = 0; i < segL; i++) {
            for (let j = 0; j < segW; j++) {
              const a = base + i * (segW + 1) + j;
              b.pushQuad(a, a + 1, a + segW + 2, a + segW + 1);
            }
          }
        }
      });

      // Leuchtende Lianen, die aus dem Blätterdach hängen (Material 14)
      const vineCount = 16;
      for (let vc = 0; vc < vineCount; vc++) {
        const ang = hash2(vc, 41.0) * Math.PI * 2.0;
        const rRim = 0.4 + hash2(vc, 42.0) * 2.3;
        const vx = topX + Math.cos(ang) * rRim;
        const vz = topZ + Math.sin(ang) * rRim;
        const vy = 0.86 - rRim * 0.025;
        const vLen = 0.12 + hash2(vc, 43.0) * 0.42;
        const nx = -Math.sin(ang), nz = Math.cos(ang);
        const vineSegs = 10;
        const startIdx = b.positions.length / 3;
        for (let sgi = 0; sgi <= vineSegs; sgi++) {
          const t = sgi / vineSegs;
          const w = lerp(0.018, 0.008, t);
          const py = vy - t * vLen;
          b.pushVertex(vx - nx * w, py, vz - nz * w, nx, 0, nz, 0, t * vLen * 40.0, 0.9, t, 1.0 + t, 14);
          b.pushVertex(vx + nx * w, py, vz + nz * w, nx, 0, nz, 1, t * vLen * 40.0, 0.9, t, 1.0 + t, 14);
        }
        for (let sgi = 0; sgi < vineSegs; sgi++) {
          const a = startIdx + sgi * 2;
          b.pushQuad(a, a + 1, a + 3, a + 2);
        }
      }

      b.computeSmoothNormals();
      return b;
    }

          const halfW = Math.pow(Math.sin(Math.min(t * 1.25 + 0.05, 1.0) * Math.PI * 0.5 + (t > 0.8 ? 0 : 0)), 0.6) * bladeW * 0.5 * (1.0 - Math.pow(t, 3.0));
          for (let j = 0; j <= segW; j++) {
            const s2 = j / segW * 2.0 - 1.0;

        }
        // Stiel

          b.pushVertex(ca * r + sa * w, y, sa * r - ca * w, 0, 1, 0, 0.45, -1.0, 0.5, 0.4, t * 0.3, 13);
          b.pushVertex(ca * r - sa * w, y, sa * r + ca * w, 0, 1, 0, 0.55, -1.0, 0.5, 0.4, t * 0.3, 13);
        }
        for (let i = 0; i < segS; i++) {
          const a = sBase + i * 2;
          b.pushQuad(a, a + 1, a + 3, a + 2);
        }
      }
      b.computeSmoothNormals();
      return b;
    }

        b.pushVertex(bx + dx * 0.5 - px * 0.7, h * 0.5, bz + dz * 0.5 - pz * 0.7, 0, 1, 0, 0, 0.5, 0.85, 0.45, 0.5, 8);
        b.pushVertex(bx + dx * 0.5 + px * 0.7, h * 0.5, bz + dz * 0.5 + pz * 0.7, 0, 1, 0, 1, 0.5, 0.85, 0.45, 0.5, 8);
        b.pushVertex(bx + dx, h, bz + dz, 0, 1, 0, 0.5, 1.0, 1.0, 1.2, 1.0, 8);
        b.pushQuad(baseIdx, baseIdx + 1, baseIdx + 3, baseIdx + 2);
        b.pushTri(baseIdx + 2, baseIdx + 3, baseIdx + 4);
      }
      b.computeSmoothNormals();
      return b;
    }

    function buildGlowBudClusterMesh() {
      const b = createGeometryBuilder();
      const buds = [
        { x: 0.0, y: 0.0, z: 0.0, r: 0.14, h: 0.38 },
        { x: 0.18, y: 0.0, z: 0.08, r: 0.11, h: 0.28 },
        { x: -0.16, y: 0.0, z: 0.11, r: 0.10, h: 0.24 },
        { x: 0.05, y: 0.0, z: -0.17, r: 0.12, h: 0.31 }
      ];
      for (const bud of buds) {
        const rings = 7, sectors = 10;
        const baseIdx = b.positions.length / 3;
        for (let ir = 0; ir <= rings; ir++) {
          const v = ir / rings;
          const profile = Math.sin(v * Math.PI) * bud.r;
          const py = bud.y + v * bud.h;
          const glow = smoothstep(0.25, 0.95, v) * 1.45;
          for (let is = 0; is <= sectors; is++) {
            const u = is / sectors;
            const ang = u * Math.PI * 2.0;
            b.pushVertex(bud.x + Math.cos(ang) * profile, py, bud.z + Math.sin(ang) * profile, Math.cos(ang), 0.3, Math.sin(ang), u, v, 0.7 + 0.3 * v, glow, v, 9);
          }
        }
        const row = sectors + 1;
        for (let ir = 0; ir < rings; ir++) {
          for (let is = 0; is < sectors; is++) {
            const a = baseIdx + ir * row + is;
            const c = a + 1;
            const d = a + row;
            const e = d + 1;
            b.pushQuad(a, c, e, d);
          }
        }
      }
      b.computeSmoothNormals();
      return b;
    }

    function buildGoldenBlossomMesh() {
      const b = createGeometryBuilder();
      const petals = 10;
      for (let p = 0; p < petals; p++) {
        const ang = (p / petals) * Math.PI * 2.0;
        const tilt = 0.55 + (p % 2) * 0.25;
        const len = 0.52;
        const wid = 0.14;
        const cosA = Math.cos(ang), sinA = Math.sin(ang);
        const px = -sinA * wid, pz = cosA * wid;
        const tipX = cosA * len * Math.sin(tilt);
        const tipZ = sinA * len * Math.sin(tilt);
        const tipY = 0.16 + len * Math.cos(tilt);
        const baseIdx = b.positions.length / 3;
        b.pushVertex(0, 0.12, 0, 0, 1, 0, 0.5, 0.0, 0.7, 0.4, 0.0, 10);
        b.pushVertex(tipX * 0.55 - px, 0.15 + len * 0.55 * Math.cos(tilt), tipZ * 0.55 - pz, 0, 1, 0, 0, 0.5, 0.9, 1.1, 0.5, 10);
        b.pushVertex(tipX * 0.55 + px, 0.15 + len * 0.55 * Math.cos(tilt), tipZ * 0.55 + pz, 0, 1, 0, 1, 0.5, 0.9, 1.1, 0.5, 10);
        b.pushVertex(tipX, tipY, tipZ, 0, 1, 0, 0.5, 1.0, 1.0, 1.65, 1.0, 10);
        b.pushTri(baseIdx, baseIdx + 1, baseIdx + 2);
        b.pushTri(baseIdx + 1, baseIdx + 3, baseIdx + 2);
      }
      b.computeSmoothNormals();
      return b;
    }

    function buildGiantMushroomMesh() {
      const b = createGeometryBuilder();
      // Stalk
      const sRings = 8, sSecs = 10;
      for (let ir = 0; ir <= sRings; ir++) {
        const v = ir / sRings;
        const r = lerp(0.14, 0.08, v);
        const y = v * 0.72;
        for (let is = 0; is <= sSecs; is++) {
          const u = is / sSecs;
          const ang = u * Math.PI * 2.0;
          b.pushVertex(Math.cos(ang) * r, y, Math.sin(ang) * r, Math.cos(ang), 0.1, Math.sin(ang), u, v, 0.6 + 0.4 * v, 0.25, v * 0.4, 11);
        }
      }
      const sRow = sSecs + 1;
      for (let ir = 0; ir < sRings; ir++) {
        for (let is = 0; is < sSecs; is++) {
          const a = ir * sRow + is;
          const c = a + 1;
          const d = a + sRow;
          const e = d + 1;
          b.pushQuad(a, c, e, d);
        }
      }
      // Cap
      const cRings = 7, cSecs = 18;
      const baseIdx = b.positions.length / 3;
      for (let ir = 0; ir <= cRings; ir++) {
        const v = ir / cRings;
        const r = Math.sin(v * Math.PI * 0.88) * 0.62;
        const y = 0.72 + Math.cos(v * Math.PI * 0.5) * 0.24;
        for (let is = 0; is <= cSecs; is++) {
          const u = is / cSecs;
          const ang = u * Math.PI * 2.0;
          const rib = 1.0 + 0.08 * Math.sin(ang * 14.0);
          const glow = (0.55 + 0.65 * Math.sin(ang * 14.0)) * smoothstep(0.15, 0.85, v);
          b.pushVertex(Math.cos(ang) * r * rib, y, Math.sin(ang) * r * rib, Math.cos(ang) * 0.5, 0.85, Math.sin(ang) * 0.5, u, v, 0.85, glow, 0.8, 11);
        }
      }
      const cRow = cSecs + 1;
      for (let ir = 0; ir < cRings; ir++) {
        for (let is = 0; is < cSecs; is++) {
          const a = baseIdx + ir * cRow + is;
          const c = a + 1;
          const d = a + cRow;
          const e = d + 1;
          b.pushQuad(a, c, e, d);
        }
      }
      b.computeSmoothNormals();
      return b;
    }

    function buildCanopyJellyfishMesh() {
      const b = createGeometryBuilder();
      // Ribbed bell (top at y=0 down to rim y=-0.42)
      const rings = 8, secs = 22;
      for (let ir = 0; ir <= rings; ir++) {
        const v = ir / rings;
        const r = Math.sin(v * Math.PI * 0.65) * 1.15;
        const y = -v * 0.42;
        for (let is = 0; is <= secs; is++) {
          const u = is / secs;
          const ang = u * Math.PI * 2.0;
          const rib = 1.0 + 0.09 * Math.sin(ang * 16.0);
          const glow = 0.75 + 0.55 * Math.sin(ang * 16.0);
          b.pushVertex(Math.cos(ang) * r * rib, y, Math.sin(ang) * r * rib, Math.cos(ang) * 0.4, 0.9, Math.sin(ang) * 0.4, u, v, 0.9, glow, 1.0, 12);
        }
      }
      const row = secs + 1;
      for (let ir = 0; ir < rings; ir++) {
        for (let is = 0; is < secs; is++) {
          const a = ir * row + is;
          const c = a + 1;
          const d = a + row;
          const e = d + 1;
          b.pushQuad(a, c, e, d);
        }
      }
      // Trailing glowing tentacles
      const tenCount = 12, tenSegs = 8;
      for (let tc = 0; tc < tenCount; tc++) {
        const ang = (tc / tenCount) * Math.PI * 2.0;
        const rStart = 0.25 + (tc % 3) * 0.22;
        const tx = Math.cos(ang) * rStart;
        const tz = Math.sin(ang) * rStart;
        const tLen = 1.35 + (tc % 4) * 0.28;
        const nx = -Math.sin(ang), nz = Math.cos(ang);
        const startIdx = b.positions.length / 3;
        for (let s = 0; s <= tenSegs; s++) {
          const t = s / tenSegs;
          const w = lerp(0.024, 0.004, t);
          const py = -0.35 - t * tLen;
          const swayX = Math.sin(t * 5.0 + tc) * 0.14 * t;
          const glow = 1.25 * (1.0 - t * 0.45);
          b.pushVertex(tx + swayX - nx * w, py, tz - nz * w, nx, 0, nz, 0, t, 0.95, glow, 1.0, 12);
          b.pushVertex(tx + swayX + nx * w, py, tz + nz * w, nx, 0, nz, 1, t, 0.95, glow, 1.0, 12);
        }
        for (let s = 0; s < tenSegs; s++) {
          const a = startIdx + s * 2;
          b.pushQuad(a, a + 1, a + 3, a + 2);
        }
      }
      b.computeSmoothNormals();
      return b;
    }

    function buildLightShaftMesh() {
      const b = createGeometryBuilder();
      const segs = 16;
      const topR = 0.35;
      const botR = 1.6;
      const h = 16.0;
      for (let iy = 0; iy <= 1; iy++) {
        const v = iy;
        const y = (1.0 - v) * h;
        const r = lerp(topR, botR, v);
        for (let is = 0; is <= segs; is++) {
          const u = is / segs;
          const ang = u * Math.PI * 2.0;
          b.pushVertex(Math.cos(ang) * r, y, Math.sin(ang) * r, Math.cos(ang), 0.15, Math.sin(ang), u, v, 1.0, 1.0, 0.0, 20);
        }
      }
      const row = segs + 1;
      for (let is = 0; is < segs; is++) {
        b.pushQuad(is, is + 1, row + is + 1, row + is);
      }
      return b;
    }

    // --- Shaders ---
    // Gemeinsamer GLSL-Code: Rauschen, leuchtende Punktmuster, Himmel und Nebel.
    // Wird vor die Fragment-Shader gehängt, die ihn brauchen.
    const GLSL_COMMON = `
    float hash21(vec2 p) {
      p = fract(p * vec2(234.34, 435.345));
      p += dot(p, p + 34.23);
      return fract(p.x * p.y);
    }
    float hash31(vec3 p) {
      p = fract(p * vec3(0.1031, 0.1030, 0.0973));
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
                 mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
      for (int i = 0; i < 4; i++) {
        v += a * vnoise(p);
        p = rot * p * 2.04;
        a *= 0.5;
      }
      return v;
    }

    // Leuchtpunkte: in jeder Zelle eines Gitters sitzt mit Wahrscheinlichkeit 'keep' ein runder Punkt.
    // Werden die Punkte kleiner als ein Pixel, wird statt dessen ihr Mittelwert gezeigt (kein Flimmern).
    // .x = Helligkeit, .y = Zufallswert der Zelle (für Farbvariation)
    vec2 dotField(vec2 p, float r, float keep) {
      vec2 c = floor(p);
      vec2 f = fract(p);
      float h = hash21(c);
      vec2 o = vec2(hash21(c + 17.1), hash21(c + 31.7)) * 0.5 + 0.25;
      float rr = r * (0.55 + 0.9 * hash21(c + 5.3));
      float d = length(f - o);
      float on = step(1.0 - keep, h);
      float dotv = on * smoothstep(rr, rr * 0.2, d);
      float fw = length(fwidth(p));
      float avg = keep * 3.14159 * r * r * 0.45;
      return vec2(mix(dotv, avg, smoothstep(r * 0.6, r * 2.2, fw)), hash21(c + 9.7));
    }

    // Farbe der Biolumineszenz: überwiegend Türkis und Blau, selten Violett
    vec3 bioColor(float h) {
      vec3 c = mix(vec3(0.05, 0.75, 1.0), vec3(0.10, 0.35, 1.0), smoothstep(0.35, 0.75, h));
      return mix(c, vec3(0.75, 0.25, 1.0), step(0.9, h));
    }

    const vec3 GIANT_DIR = vec3(-0.337, 0.379, -0.862);
    const vec3 MOON_DIR = vec3(-0.43, 0.55, -0.72);

    // Dunst am Horizont, heller in Richtung des Gasriesen
    vec3 skyHaze(vec3 dir) {
      float g = max(dot(dir, GIANT_DIR), 0.0);
      vec3 c = vec3(0.010, 0.026, 0.055);
      c += vec3(0.020, 0.055, 0.10) * pow(g, 6.0);
      return c;
    }

    vec3 skyColor(vec3 dir, float t) {
      float elev = clamp(dir.y, 0.0, 1.0);
      vec3 sky = mix(skyHaze(dir), vec3(0.002, 0.005, 0.016), pow(elev, 0.5));

      // Milchstraßenband
      vec3 bandN = normalize(vec3(0.5, 0.25, 0.83));
      float band = exp(-pow(dot(dir, bandN) * 4.5, 2.0));
      float neb = fbm(dir.xz * 5.0 / (dir.y + 0.4) + 3.0);
      sky += vec3(0.020, 0.030, 0.060) * band * (0.4 + neb) * smoothstep(0.02, 0.3, elev);

      // Sterne: Zellen auf der Himmelskugel, unterschiedliche Größe und Helligkeit
      for (int k = 0; k < 2; k++) {
        float sc = k == 0 ? 180.0 : 420.0;
        vec3 sp = dir * sc;
        vec3 cell = floor(sp);
        float h = hash31(cell);
        float thresh = k == 0 ? 0.985 : 0.965;
        if (h > thresh) {
          vec3 o = vec3(hash31(cell + 3.1), hash31(cell + 7.7), hash31(cell + 1.9)) * 0.6 + 0.2;
          float d = length(fract(sp) - o);
          float tw = 0.6 + 0.4 * sin(t * (1.5 + h * 3.0) + h * 80.0);
          float bright = (h - thresh) / (1.0 - thresh);
          vec3 sc2 = mix(vec3(0.7, 0.85, 1.0), vec3(1.0, 0.9, 0.8), hash31(cell + 5.0));
          sky += sc2 * smoothstep(0.32, 0.0, d) * tw * (k == 0 ? 2.5 : 0.9) * bright * smoothstep(0.03, 0.2, elev);
        }
      }

      // Gasriese mit Bändern, Wirbeln und Atmosphärensaum
      float cosA = dot(dir, GIANT_DIR);
      float ang = acos(clamp(cosA, -1.0, 1.0));
      float R = 0.30;
      if (ang < R * 1.25) {
        vec3 up = vec3(0.0, 1.0, 0.0);
        vec3 ax = normalize(cross(GIANT_DIR, up));
        vec3 ay = cross(ax, GIANT_DIR);
        vec2 q = vec2(dot(dir, ax), dot(dir, ay)) / R;
        float r2 = dot(q, q);
        if (r2 < 1.0) {
          vec3 n = vec3(q, sqrt(1.0 - r2));
          float lat = n.y * 0.92 + n.x * 0.25;
          float turb = fbm(vec2(lat * 9.0, n.x * 3.0) + vec2(t * 0.004, 0.0));
          float bands = 0.5 + 0.5 * sin(lat * 26.0 + turb * 4.5);
          vec3 col = mix(vec3(0.05, 0.16, 0.32), vec3(0.22, 0.52, 0.72), bands);
          col = mix(col, vec3(0.65, 0.85, 0.95), smoothstep(0.75, 0.95, turb) * 0.5);
          float spot = exp(-dot(q - vec2(0.3, -0.25), q - vec2(0.3, -0.25)) * 60.0);
          col = mix(col, vec3(0.6, 0.85, 1.0), spot * 0.6);
          // Beleuchtung durch die ferne Sonne: Sichel mit weichem Terminator
          float lit = smoothstep(-0.25, 0.6, dot(n, normalize(vec3(0.75, 0.35, 0.55))));
          float limb = pow(n.z, 0.35);
          sky = mix(sky, col * (0.04 + 0.6 * lit) * limb * 0.8, smoothstep(1.0, 0.985, r2));
        }
        float rim = exp(-abs(sqrt(r2) - 1.0) * 18.0) * smoothstep(-0.3, 0.6, q.x * 0.7 + q.y * 0.3);
        sky += vec3(0.15, 0.4, 0.8) * rim * 0.5;
      }
      sky += vec3(0.04, 0.10, 0.2) * pow(max(cosA, 0.0), 40.0) * 0.6;

      // Zwei kleine Monde
      vec3 m1Dir = normalize(vec3(-0.62, 0.30, -0.72));
      float m1 = smoothstep(0.016, 0.012, acos(clamp(dot(dir, m1Dir), -1.0, 1.0)));
      sky += vec3(0.75, 0.88, 1.0) * m1 * 2.2 + vec3(0.1, 0.2, 0.35) * pow(max(dot(dir, m1Dir), 0.0), 800.0);
      vec3 m2Dir = normalize(vec3(-0.12, 0.52, -0.84));
      float m2 = smoothstep(0.010, 0.007, acos(clamp(dot(dir, m2Dir), -1.0, 1.0)));
      sky += vec3(0.9, 0.82, 1.0) * m2 * 1.8;
      return sky;
    }

    // Höhennebel: dicht über dem Wasser und am Boden, dünn in der Höhe, mit treibenden Schwaden
    vec3 applyFog(vec3 col, vec3 wp, vec3 camPos, float t) {
      vec3 d = wp - camPos;
      float dist = length(d);
      vec3 dir = d / max(dist, 1e-3);
      float fall = 0.075;
      float h0 = camPos.y;
      float dy = d.y;
      float k = abs(dy) > 0.01 ? (1.0 - exp(-fall * dy)) / (fall * dy) : 1.0;
      float swirl = 0.55 + 0.9 * vnoise(wp.xz * 0.045 + vec2(t * 0.03, -t * 0.02));
      float dens = 0.0105 * exp(-fall * (h0 - 0.5)) * swirl;
      float f = 1.0 - exp(-dens * max(dist - 4.0, 0.0) * k);
      // tief liegender Nebel nimmt das türkise Leuchten des Waldbodens auf
      vec3 fc = skyHaze(dir) + vec3(0.0, 0.020, 0.028) * exp(-max(wp.y, 0.0) * 0.25);
      return mix(col, fc, clamp(f, 0.0, 0.97));
    }
    `;

    const VS_WORLD = `#version 300 es
    precision highp float;

    layout(location = 0) in vec3 aPos;
    layout(location = 1) in vec3 aNormal;
    layout(location = 2) in vec2 aUv;
    layout(location = 3) in vec3 aExtra;
    layout(location = 4) in float aMatId;

    layout(location = 5) in vec4 aInstCol0;
    layout(location = 6) in vec4 aInstCol1;
    layout(location = 7) in vec4 aInstCol2;
    layout(location = 8) in vec4 aInstCol3;
    layout(location = 9) in vec4 aInstTint;

    uniform mat4 uViewProj;
    uniform mat4 uModel;
    uniform vec4 uTint;
    uniform float uTime;
    uniform float uInstanced;
    uniform vec3 uOffset;

    out vec3 vWorldPos;
    out vec3 vLocalPos;
    out vec3 vNormal;
    out vec2 vUv;
    out vec3 vExtra;
    out vec4 vTint;
    out float vMatId;
    out float vSeed;

    void main() {
      mat4 modelMat = uModel;
      vec4 tint = uTint;
      if (uInstanced > 0.5) {
        modelMat = mat4(aInstCol0, aInstCol1, aInstCol2, aInstCol3);
        tint = aInstTint;
      }

      vec3 p = aPos;
      int matId = int(aMatId + 0.5);
      vec3 origin = modelMat[3].xyz;

      // Wind in Blättern, Ranken und Lianen
      if (matId == 6 || matId == 7 || matId == 8 || matId == 10 || matId == 12 || matId == 13 || matId == 14 || matId == 16) {
        float phase = origin.x * 0.37 + origin.z * 0.29 + uTime * 1.1;
        float amt = aExtra.z * 0.06;
        if (matId == 12) amt = 0.08 + aUv.y * 0.14;
        if (matId == 14 || matId == 16) amt = (aExtra.z - 1.0) * (matId == 16 ? 0.05 : 0.09);
        p.x += sin(phase + aPos.y * 2.0) * amt;
        p.z += cos(phase * 0.83 + 1.1 + aPos.y * 1.7) * amt * 0.75;
      }

      vec4 wp = modelMat * vec4(p, 1.0);
      vLocalPos = wp.xyz;
      vWorldPos = wp.xyz + uOffset;
      vNormal = normalize(mat3(modelMat) * aNormal);
      vUv = aUv;
      vExtra = aExtra;
      vTint = tint;
      vMatId = aMatId;
      vSeed = fract(origin.x * 0.137 + origin.z * 0.071);
      gl_Position = uViewProj * vec4(vWorldPos, 1.0);
    }`;

    const FS_OPAQUE = `#version 300 es
    precision highp float;

    in vec3 vWorldPos;
    in vec3 vLocalPos;
    in vec3 vNormal;
    in vec2 vUv;
    in vec3 vExtra;
    in vec4 vTint;
    in float vMatId;
    in float vSeed;

    out vec4 fragColor;

    uniform float uTime;
    uniform vec3 uCamPos;
    uniform vec3 uRidePos;
    uniform float uClip;
    uniform sampler2D uReflTex;
    uniform vec2 uScreen;
    ` + GLSL_COMMON + `

    void main() {
      int matId = int(vMatId + 0.5);
      if (uClip > 0.5 && vWorldPos.y < -0.03) discard;

      if (matId == 99) {
        vec3 dir = normalize(vWorldPos - uCamPos);
        fragColor = vec4(skyColor(dir, uTime), 1.0);
        return;
      }

      vec3 lp = vLocalPos;
      float t = uTime;
      // Reaktion auf das vorbeifahrende Boot: alles Leuchtende in der Nähe flammt auf
      float rideD = length((vWorldPos - uRidePos) * vec3(1.0, 0.6, 1.0));
      float react = 1.0 + 2.2 * exp(-rideD * 0.16) * (0.75 + 0.25 * sin(t * 3.0 - rideD * 0.8));
      // langsame Lichtwellen, die durch den Wald laufen
      float wave = 0.75 + 0.35 * sin(lp.z * 0.09 + lp.x * 0.05 + t * 0.9);

      if (matId == 1) {
        // Fluss: dunkler Spiegel mit Reflexionen, treibendem Plankton und leuchtendem Ufersaum
        vec2 q = lp.xz;
        vec2 flow = vec2(0.0, t * 0.55);
        float e = 0.15;
        float h0 = vnoise(q * 0.9 + flow) * 0.6 + vnoise(q * 2.3 + flow * 1.7 + 4.0) * 0.3 + vnoise(q * 6.0 + flow * 2.5) * 0.1;
        float hx = vnoise((q + vec2(e, 0.0)) * 0.9 + flow) * 0.6 + vnoise((q + vec2(e, 0.0)) * 2.3 + flow * 1.7 + 4.0) * 0.3 + vnoise((q + vec2(e, 0.0)) * 6.0 + flow * 2.5) * 0.1;
        float hz = vnoise((q + vec2(0.0, e)) * 0.9 + flow) * 0.6 + vnoise((q + vec2(0.0, e)) * 2.3 + flow * 1.7 + 4.0) * 0.3 + vnoise((q + vec2(0.0, e)) * 6.0 + flow * 2.5) * 0.1;
        vec3 N = normalize(vec3(-(hx - h0) / e * 0.22, 1.0, -(hz - h0) / e * 0.22));
        vec3 V = normalize(uCamPos - vWorldPos);
        float fres = 0.04 + 0.96 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
        vec2 suv = gl_FragCoord.xy / uScreen + N.xz * vec2(0.035, 0.05);
        vec3 refl = texture(uReflTex, clamp(suv, vec2(0.001), vec2(0.999))).rgb;
        vec3 deep = vec3(0.002, 0.010, 0.016);
        vec3 col = mix(deep, refl, 0.35 + 0.6 * fres);

        // Plankton, das mit der Strömung treibt
        vec2 pd = dotField(q * 1.4 + vec2(0.0, t * 0.8), 0.1, 0.12);
        col += bioColor(pd.y * 0.7) * pd.x * (0.8 + 0.6 * sin(t * 2.0 + pd.y * 40.0)) * 1.4 * react;
        // Ufersaum
        float shore = vExtra.x;
        float foam = smoothstep(0.25, 0.95, shore) * (0.5 + 0.5 * vnoise(q * 3.0 + flow * 2.0));
        col += vec3(0.05, 0.55, 0.75) * foam * 0.18 * wave * react;
        // Mondglanz
        vec3 H = normalize(MOON_DIR + V);
        col += vec3(0.4, 0.6, 0.9) * pow(max(dot(N, H), 0.0), 220.0) * 1.5;
        col = applyFog(col, vWorldPos, uCamPos, t);
        fragColor = vec4(clamp(col, vec3(0.0), vec3(30.0)), 1.0);
        return;
      }

      vec3 N = normalize(vNormal);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(uCamPos - vWorldPos);
      float ao = vExtra.x;
      float glowMask = vExtra.y;

      // Feine Oberflächenstruktur aus Rauschen (Triplanar)
      vec3 bl = abs(N);
      bl /= max(bl.x + bl.y + bl.z, 0.001);
      float nXY = fbm(lp.xy * 1.3), nXZ = fbm(lp.xz * 1.3), nYZ = fbm(lp.yz * 1.3);
      float tex = nYZ * bl.x + nXZ * bl.y + nXY * bl.z;
      float fine = fbm(lp.xz * 5.1 + lp.yy * 3.7);

      vec3 base = vec3(0.02);
      vec3 emissive = vec3(0.0);
      float rough = 0.6;
      float wet = 0.0;

      if (matId == 0) {
        // Waldboden: Moos mit Leuchtpunkten, nasser Fels am Wasser
        float moss = smoothstep(0.25, 0.75, N.y) * smoothstep(-0.4, 0.2, lp.y);
        vec3 rock = vec3(0.012, 0.016, 0.026) * (0.6 + 0.8 * fine);
        vec3 mossCol = mix(vec3(0.010, 0.030, 0.026), vec3(0.020, 0.055, 0.040), tex);
        base = mix(rock, mossCol, moss);
        wet = 1.0 - smoothstep(-0.2, 0.6, lp.y);
        float patchM = smoothstep(0.38, 0.68, fbm(lp.xz * 0.22 + 7.0));
        vec2 d1 = dotField(lp.xz * 2.4, 0.16, 0.45);
        vec2 d2 = dotField(lp.xz * 7.0 + 3.0, 0.2, 0.35);
        float dots = (d1.x * 1.2 + d2.x * 0.7) * patchM * moss * (0.25 + glowMask);
        emissive += bioColor(d1.y) * dots * 1.6;
        // flächiges Moosleuchten unter dichten Stellen
        emissive += vec3(0.0, 0.05, 0.06) * patchM * moss * glowMask * 0.6;
      } else if (matId == 2) {
        // Fels: dunkler Schiefer mit Schichtung, Moospolster oben, Flechtenpunkte
        float strata = 0.5 + 0.5 * sin(lp.y * 3.6 + tex * 5.0 + fine * 1.5);
        base = mix(vec3(0.010, 0.014, 0.024), vec3(0.030, 0.040, 0.058), strata * tex) * vTint.rgb;
        float moss = smoothstep(0.45, 0.85, N.y + (fine - 0.5) * 0.4);
        base = mix(base, vec3(0.012, 0.040, 0.035) * (0.7 + 0.6 * fine), moss);
        vec2 dp = abs(N.y) > 0.6 ? lp.xz : (abs(N.x) > abs(N.z) ? lp.zy : lp.xy);
        vec2 d1 = dotField(dp * 3.0, 0.17, 0.3);
        float lichen = smoothstep(0.45, 0.7, fbm(dp * 0.5 + 2.0));
        emissive += bioColor(d1.y) * d1.x * (moss * 1.4 + lichen * 0.5) * 1.3;
        emissive += vec3(0.05, 0.4, 0.6) * glowMask * smoothstep(0.62, 0.8, fine) * 0.25;
        wet = 1.0 - smoothstep(0.0, 2.0, lp.y);
      } else if (matId == 5) {
        // Baumstamm: dunkle, gerippte Rinde mit Reihen leuchtender Punkte
        float ridges = 0.5 + 0.5 * sin(vUv.x * 55.0 + fbm(vec2(vUv.x * 8.0, vUv.y * 2.0)) * 6.0);
        base = mix(vec3(0.012, 0.010, 0.018), vec3(0.035, 0.030, 0.045), ridges * (0.5 + tex));
        vec2 d1 = dotField(vec2(vUv.x * 16.0, vUv.y * 9.0 + vSeed * 10.0), 0.24, 0.5);
        float band = smoothstep(0.3, 0.7, sin(vUv.y * 1.6 + vUv.x * 3.14159 + vSeed * 6.0) * 0.5 + 0.5);
        float lower = 1.0 - smoothstep(0.5, 3.5, vUv.y);
        emissive += mix(vTint.rgb, bioColor(d1.y), 0.5) * d1.x * (band * 0.8 + lower * 0.6) * 2.0;
        rough = 0.8;
      } else if (matId == 6) {
        // Blätterdach: dunkle Blätter, Unterseite mit leuchtenden Punkten und Blattrand
        float edge = 1.0 - abs(vUv.x * 2.0 - 1.0);
        float midrib = exp(-abs(vUv.x - 0.5) * 30.0);
        base = mix(vec3(0.008, 0.030, 0.030), vec3(0.020, 0.060, 0.050), vUv.y * tex);
        vec2 d1 = dotField(vec2(vUv.x * 6.0, vUv.y * 14.0 + vSeed * 20.0), 0.22, 0.35);
        float under = smoothstep(0.2, -0.4, N.y) * 0.7 + 0.3;
        emissive += vTint.rgb * (d1.x * 1.3 * under + midrib * 0.12 + smoothstep(0.12, 0.0, edge) * 0.25) * smoothstep(0.1, 0.5, vUv.y);
        wet = 0.5;
      } else if (matId == 14 || matId == 16) {
        // Lianen: leuchtende Perlen entlang der Ranke, zur Spitze hin heller
        float beads = smoothstep(0.8, 0.98, sin(vUv.y * 1.3) * 0.5 + 0.5);
        float tip = vExtra.y;
        vec3 c = matId == 16 ? vec3(0.1, 0.8, 1.0) : mix(vTint.rgb, vec3(0.1, 0.8, 1.0), 0.4);
        base = vec3(0.01, 0.03, 0.03);
        emissive += c * (0.03 + beads * 0.35 + tip * tip * 0.9);
      } else if (matId == 7) {
        // Farne: Mittelrippe und Blattrand leuchten
        float midrib = exp(-abs(vUv.x - 0.5) * 18.0);
        float edge = exp(-min(vUv.x, 1.0 - vUv.x) * 16.0);
        base = vec3(0.010, 0.040, 0.036);
        emissive += vTint.rgb * (midrib * 0.9 + edge * 0.5) * (0.3 + 0.7 * vUv.y) * (0.3 + glowMask);
      } else if (matId == 8) {
        base = vec3(0.01, 0.035, 0.035);
        emissive += vTint.rgb * glowMask * glowMask * 1.3;
      } else if (matId == 9) {
        base = vec3(0.02, 0.05, 0.08);
        float rings = 0.6 + 0.4 * sin(vUv.y * 30.0);
        emissive += vTint.rgb * (0.25 + glowMask * 1.6 * rings);
      } else if (matId == 10) {
        // goldene Blüten
        base = vec3(0.05, 0.02, 0.02);
        emissive += vTint.rgb * (0.2 + glowMask * 1.4);
      } else if (matId == 11) {
        // Pilze: gepunkteter Hut, Lamellen leuchten
        vec2 d1 = dotField(vUv * vec2(14.0, 6.0), 0.25, 0.6);
        base = vec3(0.03, 0.02, 0.05) * (0.6 + tex);
        emissive += vTint.rgb * (glowMask * 0.35 + d1.x * 1.5 + smoothstep(0.2, -0.6, N.y) * 0.9);
      } else if (matId == 12) {
        // schwebende Quallen
        base = vec3(0.02, 0.04, 0.07);
        float fres2 = pow(1.0 - abs(dot(N, V)), 2.0);
        emissive += vTint.rgb * (0.15 + glowMask * 0.6 + fres2 * 0.9);
      } else if (matId == 13) {
        // Großblättrige Pflanzen: Adern und Ränder leuchten
        float mid = exp(-abs(vUv.x - 0.5) * 26.0);
        float lat = abs(fract((vUv.y - abs(vUv.x - 0.5) * 0.9) * 9.0) - 0.5);
        float veins = smoothstep(0.06, 0.0, lat) * smoothstep(0.02, 0.1, abs(vUv.x - 0.5));
        float edge = exp(-min(vUv.x, 1.0 - vUv.x) * 22.0);
        base = mix(vec3(0.006, 0.030, 0.034), vec3(0.016, 0.060, 0.055), tex);
        float on = vUv.y < 0.0 ? 0.15 : 1.0;
        emissive += vTint.rgb * (mid * 1.0 + veins * 0.55 + edge * 0.45) * on * (0.4 + 0.6 * smoothstep(0.0, 0.4, vUv.y));
        wet = 0.6;
      }

      // Beleuchtung: kühles Licht des Gasriesen, Himmel, Widerschein des leuchtenden Bodens
      float nDotL = max(dot(N, MOON_DIR), 0.0);
      float hemi = N.y * 0.5 + 0.5;
      vec3 ambient = mix(vec3(0.010, 0.030, 0.035), vec3(0.018, 0.036, 0.070), hemi) * ao;
      vec3 moon = vec3(0.16, 0.26, 0.45) * nDotL * ao;
      vec3 H = normalize(MOON_DIR + V);
      float specPow = mix(18.0, 90.0, wet);
      float spec = pow(max(dot(N, H), 0.0), specPow) * (0.04 + wet * 0.5);
      float rim = pow(1.0 - max(dot(N, V), 0.0), 4.0) * 0.12;
      vec3 col = base * (ambient + moon) * 2.2;
      col += vec3(0.25, 0.45, 0.8) * spec * ao;
      col += vec3(0.05, 0.12, 0.22) * rim * ao;
      col += emissive * wave * react * (0.85 + 0.15 * sin(t * 1.7 + vSeed * 30.0));
      col = applyFog(col, vWorldPos, uCamPos, t);
      fragColor = vec4(clamp(col, vec3(0.0), vec3(30.0)), 1.0);
    }`;

    const VS_FX = `#version 300 es
    precision highp float;

    layout(location = 0) in vec3 aPos;
    layout(location = 1) in vec3 aNormal;
    layout(location = 2) in vec2 aUv;
    layout(location = 3) in vec3 aExtra;
    layout(location = 4) in float aMatId;

    uniform mat4 uViewProj;
    uniform mat4 uModel;
    uniform vec4 uTint;
    uniform vec3 uOffset;

    out vec3 vWorldPos;
    out vec3 vNormal;
    out vec2 vUv;
    out vec3 vExtra;
    out vec4 vTint;
    out float vMatId;

    void main() {
      vec4 wp = uModel * vec4(aPos, 1.0);
      wp.xyz += uOffset;
      vWorldPos = wp.xyz;
      vNormal = normalize(mat3(uModel) * aNormal);
      vUv = aUv;
      vExtra = aExtra;
      vTint = uTint;
      vMatId = aMatId;
      gl_Position = uViewProj * wp;
    }`;

    const FS_FX = `#version 300 es
    precision highp float;

    in vec3 vWorldPos;
    in vec3 vNormal;
    in vec2 vUv;
    in vec3 vExtra;
    in vec4 vTint;
    in float vMatId;

    out vec4 fragColor;

    uniform float uTime;
    uniform vec3 uCamPos;
    ` + GLSL_COMMON + `

    void main() {
      int matId = int(vMatId + 0.5);
      float d = length(vWorldPos - uCamPos);
      float distFade = exp(-max(d - 25.0, 0.0) * 0.012);

      if (matId == 4) {
        // Wasserfall aus feinen Strähnen
        float edgeFade = vExtra.x;
        float layerBoost = vExtra.y;
        float warp = (vnoise(vec2(vUv.x * 7.0, vUv.y * 2.5 - uTime * 2.4)) - 0.5) * 0.18;
        float s1 = vnoise(vec2((vUv.x + warp) * 26.0, vUv.y * 4.5 - uTime * 4.8));
        float s2 = vnoise(vec2((vUv.x - warp * 0.7) * 52.0 + 4.3, vUv.y * 8.0 - uTime * 7.6));
        float filaments = pow(clamp(s1 * 0.55 + s2 * 0.45, 0.0, 1.0), 2.2);
        float vNorm = clamp(vUv.y / 3.0, 0.0, 1.0);
        float crest = (1.0 - smoothstep(0.0, 0.12, vNorm)) * 0.4;
        float splash = smoothstep(0.8, 1.0, vNorm) * 0.8;
        vec3 waterCol = mix(vec3(0.06, 0.40, 0.75), vec3(0.65, 0.92, 1.0), clamp(filaments * 1.3 + splash * 0.5, 0.0, 1.0));
        float alpha = edgeFade * (0.12 + 0.6 * filaments + crest + splash) * distFade;
        fragColor = vec4(waterCol * layerBoost * alpha * 0.9, alpha);
      } else if (matId == 15) {
        // Ringwellen im Becken unter dem Wasserfall
        float distR = 1.0 - vExtra.x;
        float rings = 0.5 + 0.5 * sin(distR * 28.0 - uTime * 5.2);
        float ringLine = pow(rings, 4.0) * smoothstep(0.0, 0.18, distR) * smoothstep(1.0, 0.25, distR);
        float coreMist = exp(-distR * 4.5) * 0.5;
        vec3 col = mix(vec3(0.10, 0.65, 0.9), vec3(0.6, 0.9, 1.0), coreMist);
        float alpha = (ringLine * 0.4 + coreMist) * distFade;
        fragColor = vec4(col * alpha, alpha);
      } else {
        // dünne Lichtstrahlen des Gasriesen durch das Blätterdach
        vec3 N = normalize(vNormal);
        vec3 V = normalize(uCamPos - vWorldPos);
        float viewFade = pow(abs(dot(N, V)), 2.0);
        float verticalFade = sin(clamp(vUv.y, 0.0, 1.0) * 3.14159) * smoothstep(0.0, 0.4, vUv.y);
        float shimmer = 0.6 + 0.4 * vnoise(vec2(vUv.x * 10.0 + uTime * 0.15, vUv.y * 3.0 - uTime * 0.1));
        float alpha = viewFade * verticalFade * shimmer * 0.035 * distFade;
        fragColor = vec4(vTint.rgb * alpha, alpha);
      }
    }`;

    // Glühwürmchen und schwebende Samen um die Kamera herum
    const VS_PARTICLES = `#version 300 es
    precision highp float;

    layout(location = 0) in vec3 aSeed;
    layout(location = 1) in vec3 aColor;
    layout(location = 2) in float aSize;

    uniform mat4 uViewProj;
    uniform float uTime;
    uniform vec3 uCamPos;
    uniform vec3 uRidePos;
    uniform float uPixelRatio;
    uniform float uLoop;

    out vec3 vColor;
    out float vAlpha;

    float riverX(float z) {
      float k = 6.2831853 / uLoop;
      return sin(z * k * 2.0) * 7.5 + cos(z * k) * 4.2 + sin(z * k * 3.0 + 1.3) * 1.6;
    }

    void main() {
      float t = uTime * (0.25 + aSeed.z * 0.35) + aSeed.x * 37.0;
      float zWrap = mod(aSeed.y * 140.0 - uTime * (0.6 + aSeed.z * 1.2), 140.0);
      float z = uRidePos.z + 20.0 - zWrap;
      float spread = 2.0 + aSeed.z * 12.0;
      float x = riverX(z) + (fract(aSeed.x * 7.31) * 2.0 - 1.0) * spread + sin(t * 1.3 + aSeed.x * 20.0) * 1.2;
      float y = 0.5 + fract(aSeed.x * 13.7) * 7.0 + sin(t * 0.9) * 0.5;

      vec4 wp = vec4(x, y, z, 1.0);
      float dist = length(wp.xyz - uCamPos);
      float fade = exp(-max(dist - 10.0, 0.0) * 0.03) * smoothstep(0.5, 3.0, dist);
      float blink = smoothstep(0.2, 0.9, sin(uTime * (0.8 + aSeed.z) + aSeed.y * 80.0) * 0.5 + 0.5);

      vColor = aColor;
      vAlpha = fade * (0.15 + 0.85 * blink);
      gl_Position = uViewProj * wp;
      gl_PointSize = clamp((aSize * uPixelRatio * 22.0) / max(dist, 1.5), 1.0, 10.0);
    }`;

    const FS_PARTICLES = `#version 300 es
    precision highp float;

    in vec3 vColor;
    in float vAlpha;
    out vec4 fragColor;

    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float r2 = dot(p, p);
      if (r2 > 1.0) discard;
      float core = exp(-r2 * 7.0);
      fragColor = vec4(vColor * core * vAlpha * 3.0, 0.0);

    // Leuchtpunkte am Waldboden (fest platziert, pulsieren und reagieren auf das Boot)
    const VS_GLOWDOTS = `#version 300 es
    precision highp float;

    layout(location = 0) in vec3 aPos;
    layout(location = 1) in vec3 aColor;
    layout(location = 2) in float aSize;

    uniform mat4 uViewProj;
    uniform float uTime;
    uniform vec3 uCamPos;
    uniform vec3 uRidePos;
    uniform vec3 uOffset;
    uniform float uPixelRatio;
    uniform float uMirror;

    out vec3 vColor;

    void main() {
      vec3 wp = aPos + uOffset;
      if (uMirror > 0.5 && wp.y < 0.0) wp.y = -1000.0;
      float dist = length(wp - uCamPos);
      float rideD = length((wp - uRidePos) * vec3(1.0, 0.6, 1.0));
      float react = 1.0 + 2.5 * exp(-rideD * 0.18);
      float seed = fract(aPos.x * 0.731 + aPos.z * 0.317);
      float pulse = 0.55 + 0.45 * sin(uTime * (0.7 + seed * 1.3) + seed * 50.0 + aPos.z * 0.08);
      float fade = exp(-max(dist - 20.0, 0.0) * 0.025);
      vColor = aColor * pulse * react * fade;
      gl_Position = uViewProj * vec4(wp, 1.0);
      gl_PointSize = clamp(aSize * uPixelRatio * 9.0 / max(dist, 1.0), 1.0, 7.0);
    }`;

    const FS_GLOWDOTS = `#version 300 es
    precision highp float;
    in vec3 vColor;
    out vec4 fragColor;
    void main() {
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float r2 = dot(p, p);

    const VS_QUAD = `#version 300 es

    layout(location = 0) in vec2 aPos;
    out vec2 vUv;
    void main() {
